<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740"><rect width="1200" height="740" rx="24" fill="#f4f7f5"/><rect width="1200" height="76" fill="white"/><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#22382d"><text x="42" y="48" font-size="27" font-weight="bold">✳ ThinkFirst</text><text x="856" y="46" font-size="17">历史对话　设置　新对话</text><text x="70" y="140" font-size="32" font-weight="bold">动手之前，先想清楚。</text><text x="70" y="181" font-size="20" fill="#5e7467">用对话把一个想法，整理成能执行的需求文档。</text><rect x="70" y="215" width="650" height="435" rx="20" fill="white" stroke="#dce5df"/><rect x="760" y="215" width="370" height="435" rx="20" fill="white" stroke="#dce5df"/><text x="100" y="264" font-size="22" fill="#7855b4">●　点我优化</text><text x="100" y="310" font-size="23" font-weight="bold">谁会用这个产品？想解决什么问题？</text><g fill="#f6f9f7" stroke="#dce5df"><rect x="100" y="337" width="590" height="68" rx="12"/><rect x="100" y="421" width="590" height="68" rx="12"/><rect x="100" y="512" width="590" height="100" rx="12"/></g><text x="122" y="378" font-size="18">A　学生每天整理错题，需要更方便地记录与复习。</text><text x="122" y="462" font-size="18">B　先做好记录与提醒，再逐步完善。</text><text x="122" y="552" font-size="18" fill="#687d70">也可以填写自己的回答…</text><rect x="584" y="563" width="84" height="34" rx="8" fill="#7557b7"/><text x="605" y="587" fill="white" font-size="16">发送</text><text x="790" y="264" font-size="23" font-weight="bold">需求文档</text><text x="790" y="316" font-size="19">目标用户</text><text x="790" y="350" font-size="17" fill="#687d70">需要记录、整理和复习错题的学生</text><text x="790" y="404" font-size="19">核心功能</text><text x="790" y="438" font-size="17" fill="#687d70">记录错题 · 分类复习 · 进度保存</text><text x="790" y="492" font-size="19">验收标准</text><text x="790" y="526" font-size="17" fill="#687d70">说明操作流程、边界与完成条件</text><text x="790" y="594" font-size="17" fill="#7855b4">查看预览　轻度润色　导出 Markdown</text><text x="70" y="703" font-size="17" fill="#687d70">界面示意 · 快速梳理 / 逐步深入 · DeepSeek / 通义千问 · 历史恢复</text></g></